[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smee"
description = "Differentiably compute energies of molecules using SMIRNOFF force fields."
authors = [ {name = "Simon Boothroyd"} ]
license = { text = "MIT" }
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = ["Programming Language :: Python :: 3"]

[tool.setuptools.packages.find]
include = ["smee*"]

[tool.setuptools_scm]

[tool.ruff]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
ignore = ["C901","E402","E501"]
select = ["B","C","E","F","W","B9"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
omit = ["**/tests/*", "smee/mm/_fe.py"]

[tool.coverage.report]
exclude_lines = [
    "@overload",
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ = .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]

[tool.pytest.ini_options]
markers = [
    "fe: run free energy regression tests",
]
addopts = "-m 'not fe'"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
smee = { path = ".", editable = true }

# Mirrors the post-change conda-forge `smee-base` recipe run-deps (sans `nnpops`).
# Everything else — including the rest of the full `smee` recipe surface
# (openmm, packmol, numpy, msgpack-python, pydantic, pydantic-units, rdkit,
# and nnpops) — lives in the `mm` feature.
# `networkx` is needed at `import smee` time but comes in transitively via
# pytorch (which requires networkx>=2.5.1), matching the recipe.
[tool.pixi.dependencies]
python = ">=3.11"
pytorch = "*"
pip = "*"
openff-units = "*"
openff-toolkit-base = ">=0.9.2"
openff-interchange-base = ">=0.3.17"

[tool.pixi.feature.cu12]
platforms = ["linux-64"]

[tool.pixi.feature.cu12.system-requirements]
cuda = "12"

[tool.pixi.feature.cu12.dependencies]
cuda-version = "12.*"
pytorch-gpu = "*"

# Combining these deps with the base deps gives the same deps
# as the full `smee` recipe on conda-forge.
[tool.pixi.feature.mm.dependencies]
openmm = "*"
python-symengine = "*"
rdkit = "*"
packmol = "*"
numpy = "*"
msgpack-python = "*"
nnpops = "*"
pydantic = "*"
pydantic-units = "*"

[tool.pixi.feature.fe.dependencies]
mdtraj = "*"
absolv = ">=1.0.1"

[tool.pixi.feature.openeye]
channels = ["openeye"]

[tool.pixi.feature.openeye.dependencies]
openeye-toolkits = "*"

[tool.pixi.feature.ambertools.dependencies]
ambertools = "*"

[tool.pixi.feature.examples.dependencies]
jupyter = "*"
nbconvert = "*"
nglview = "*"
smirnoff-plugins = "*"

[tool.pixi.feature.dev.dependencies]
scipy = "*"
setuptools_scm = ">=8"
pre-commit = "*"
ruff = "*"
nbqa = "*"
pytest = "*"
pytest-cov = "*"
pytest-mock = "*"
codecov = "*"

[tool.pixi.feature.docs.dependencies]
mkdocs = "*"
mkdocs-material = "*"
mkdocs-gen-files = "*"
mkdocs-literate-nav = "*"
mkdocs-jupyter = "*"
mkdocstrings = "*"
mkdocstrings-python = ">=1.10.8"
griffe-pydantic = "*"
black = "*"
mike = "*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.pydantic-2.dependencies]
pydantic = ">=2.0"

[tool.pixi.feature.pydantic-1.dependencies]
pydantic = "<2.0"

[tool.pixi.environments]
# Default env is the same as openeye-fe-examples-cpu-py312
default = { features = ["py312", "mm", "fe", "examples", "dev", "docs", "pydantic-2", "openeye"], solve-group = "cpu-py312-pydantic2" }
openeye-fe-examples-cpu-py311 = { features = ["py311", "mm", "fe", "examples", "dev", "docs", "pydantic-2", "openeye"], solve-group = "cpu-py311-pydantic2" }
openeye-fe-examples-cpu-py312 = { features = ["py312", "mm", "fe", "examples", "dev", "docs", "pydantic-2", "openeye"], solve-group = "cpu-py312-pydantic2" }
ambertools-fe-examples-cpu-py311 = { features = ["py311", "mm", "fe", "examples", "dev", "docs", "pydantic-2", "ambertools"], solve-group = "cpu-py311-pydantic2" }
ambertools-fe-examples-cpu-py312 = { features = ["py312", "mm", "fe", "examples", "dev", "docs", "pydantic-2", "ambertools"], solve-group = "cpu-py312-pydantic2" }
# we get rid of examples here until smirnoff-plugins can be installed without ambertools
# we also get rid of fe as absolv also installs ambertools
openeye-cpu-py311 = { features = ["py311", "mm", "dev", "docs", "pydantic-2", "openeye"], solve-group = "cpu-py311-pydantic2" }
openeye-cpu-py312 = { features = ["py312", "mm", "dev", "docs", "pydantic-2", "openeye"], solve-group = "cpu-py312-pydantic2" }
ambertools-fe-examples-cu12-py311 = { features = ["py311", "cu12", "mm", "fe", "examples", "dev", "docs", "pydantic-2", "ambertools"], solve-group = "cu12-py311-pydantic2" }
ambertools-fe-examples-cu12-py312 = { features = ["py312", "cu12", "mm", "fe", "examples", "dev", "docs", "pydantic-2", "ambertools"], solve-group = "cu12-py312-pydantic2" }
# The fe feature is excluded when pydantic < 2 as femto (used by absolv) needs pydantic >= 2
ambertools-examples-pydantic-1-cpu-py311 = { features = ["py311", "mm", "examples", "dev", "docs", "pydantic-1", "ambertools"], solve-group = "cpu-py311-pydantic1" }
ambertools-examples-pydantic-1-cpu-py312 = { features = ["py312", "mm", "examples", "dev", "docs", "pydantic-1", "ambertools"], solve-group = "cpu-py312-pydantic1" }
ambertools-examples-pydantic-1-cu12-py311 = { features = ["py311", "cu12", "mm", "examples", "dev", "docs", "pydantic-1", "ambertools"], solve-group = "cu12-py311-pydantic1" }
ambertools-examples-pydantic-1-cu12-py312 = { features = ["py312", "cu12", "mm", "examples", "dev", "docs", "pydantic-1", "ambertools"], solve-group = "cu12-py312-pydantic1" }
# mirrors the post-change conda-forge `smee-base` recipe (no mm-stack deps, no nnpops)
base-py311 = { features = ["py311", "dev"], solve-group = "cpu-py311-base" }
base-py312 = { features = ["py312", "dev"], solve-group = "cpu-py312-base" }

[tool.pixi.tasks]
lint = "ruff check smee examples"
format = { cmd = "ruff format smee examples && ruff check --fix --select I smee examples" }
test = "pytest -v --cov=smee --cov-append --cov-report=xml --color=yes smee/tests/"
test-examples = "jupyter nbconvert --to notebook --execute examples/compute-energy.ipynb examples/conformer-minimization.ipynb examples/parameter-gradients.ipynb"
docs = "mkdocs build"
docs-serve = "mkdocs serve"
