[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=61", "setuptools-scm>=8", "wheel" ]

[project]
name = "smee"
description = "Differentiably compute energies of molecules using SMIRNOFF force fields."
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "Simon Boothroyd" } ]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]

[tool.setuptools]
packages.find.include = [ "smee*" ]

[tool.setuptools_scm]

[tool.pixi]
workspace.channels = [ "conda-forge" ]
workspace.platforms = [ "linux-64", "osx-arm64" ]
dependencies.openff-interchange-base = ">=0.3.17"
dependencies.openff-toolkit-base = ">=0.9.2"
dependencies.openff-units = "*"
dependencies.pip = "*"
# Mirrors the conda-forge `smee-base` recipe run-deps.
# Everything else — including the rest of the full `smee` recipe
# (openmm, packmol, numpy, msgpack-python, pydantic, pydantic-units, rdkit,
# and nnpops) — lives in the `mm` feature.
dependencies.python = ">=3.12"
dependencies.pytorch = "*"
pypi-dependencies.smee = { path = ".", editable = true }
tasks.docs = "mkdocs build"
tasks.docs-serve = "mkdocs serve"
tasks.format = { cmd = "ruff format smee examples && ruff check --fix --select I smee examples" }
tasks.lint = "ruff check smee examples"
tasks.test = "pytest -v --cov=smee --cov-append --cov-report=xml --color=yes smee/tests/"
tasks.test-examples = """\
  jupyter nbconvert --to notebook --execute examples/compute-energy.ipynb examples/conformer-minimization.ipynb \
  examples/parameter-gradients.ipynb\
  """
feature.ambertools.dependencies.ambertools = "*"
feature.cu12.dependencies.cuda-version = "12.*"
feature.cu12.dependencies.pytorch-gpu = "*"
feature.cu12.platforms = [ "linux-64" ]
feature.cu12.system-requirements.cuda = "12"
feature.dev.dependencies.ipdb = "*"
feature.dev.dependencies.ipython = "*"
feature.dev.dependencies.nbqa = "*"
feature.dev.dependencies.pre-commit = "*"
feature.dev.dependencies.ruff = "*"
feature.docs.dependencies.black = "*"
feature.docs.dependencies.griffe-pydantic = "*"
feature.docs.dependencies.mike = "*"
feature.docs.dependencies.mkdocs = "*"
feature.docs.dependencies.mkdocs-gen-files = "*"
feature.docs.dependencies.mkdocs-jupyter = "*"
feature.docs.dependencies.mkdocs-literate-nav = "*"
feature.docs.dependencies.mkdocs-material = "*"
feature.docs.dependencies.mkdocstrings = "*"
feature.docs.dependencies.mkdocstrings-python = ">=1.10.8"
feature.examples.dependencies.jupyter = "*"
feature.examples.dependencies.nbconvert = "*"
feature.examples.dependencies.nglview = "*"
feature.examples.dependencies.smirnoff-plugins = "*"
feature.fe.dependencies.absolv = ">=1.0.1"
feature.fe.dependencies.mdtraj = "*"
feature.mm.dependencies.msgpack-python = "*"
feature.mm.dependencies.nnpops = "*"
feature.mm.dependencies.numpy = "*"
feature.mm.dependencies.openmm = "*"
feature.mm.dependencies.packmol = "*"
feature.mm.dependencies.pydantic = "*"
feature.mm.dependencies.pydantic-units = "*"
feature.mm.dependencies.python-symengine = "*"
feature.mm.dependencies.rdkit = "*"
# Combining these deps with the base deps gives the same deps
# as the full `smee` recipe on conda-forge.
feature.mm.dependencies.setuptools_scm = ">=8"
feature.openeye.channels = [ "openeye" ]
feature.openeye.dependencies.openeye-toolkits = "*"
feature.py312.dependencies.python = "3.12.*"
feature.pydantic-1.dependencies.pydantic = "<2.0"
feature.pydantic-2.dependencies.pydantic = ">=2.0"
feature.test.dependencies.codecov = "*"
feature.test.dependencies.pytest = "*"
feature.test.dependencies.pytest-cov = "*"
feature.test.dependencies.pytest-mock = "*"
feature.test.dependencies.scipy = "*"
# The fe feature is excluded when pydantic < 2 as femto (used by absolv) needs pydantic >= 2
environments.ambertools-examples-pydantic-1-cpu-py312 = { features = [
  "py312",
  "mm",
  "examples",
  "test",
  "docs",
  "pydantic-1",
  "ambertools"
], solve-group = "cpu-py312-pydantic1" }
environments.ambertools-examples-pydantic-1-cu12-py312 = { features = [
  "py312",
  "cu12",
  "mm",
  "examples",
  "test",
  "docs",
  "pydantic-1",
  "ambertools"
], solve-group = "cu12-py312-pydantic1" }
environments.ambertools-fe-examples-cpu-py312 = { features = [
  "py312",
  "mm",
  "fe",
  "examples",
  "test",
  "docs",
  "pydantic-2",
  "ambertools"
], solve-group = "cpu-py312-pydantic2" }
environments.ambertools-fe-examples-cu12-py312 = { features = [
  "py312",
  "cu12",
  "mm",
  "fe",
  "examples",
  "test",
  "docs",
  "pydantic-2",
  "ambertools"
], solve-group = "cu12-py312-pydantic2" }
# mirrors the conda-forge `smee-base` recipe (no mm-stack deps)
environments.base-py312 = { features = [ "py312", "test" ], solve-group = "cpu-py312-base" }
# Default env is the same as openeye-fe-examples-cpu-py312
environments.default = { features = [ "py312", "mm", "fe", "examples", "test", "docs", "pydantic-2", "openeye" ], solve-group = "cpu-py312-pydantic2" }
environments.dev = { features = [ "py312", "test", "dev" ], solve-group = "cpu-py312-base" }
# we get rid of examples here until smirnoff-plugins can be installed without ambertools
# we also get rid of fe as absolv also installs ambertools
environments.openeye-cpu-py312 = { features = [ "py312", "mm", "test", "docs", "pydantic-2", "openeye" ], solve-group = "cpu-py312-pydantic2" }
environments.openeye-fe-examples-cpu-py312 = { features = [
  "py312",
  "mm",
  "fe",
  "examples",
  "test",
  "docs",
  "pydantic-2",
  "openeye"
], solve-group = "cpu-py312-pydantic2" }

[tool.ruff]
extend-include = [ "*.ipynb" ]
lint.select = [ "B", "B9", "C", "E", "F", "W" ]
lint.ignore = [ "C901", "E402", "E501" ]
lint.pydocstyle.convention = "google"

[tool.pytest]
ini_options.addopts = "-m 'not fe'"
ini_options.markers = [
  "fe: run free energy regression tests",
]

[tool.coverage]
run.omit = [ "**/tests/*", "smee/mm/_fe.py" ]
report.exclude_lines = [
  "@overload",
  "if __name__ = .__main__.:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]
